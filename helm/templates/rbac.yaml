apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Values.serviceAccount.name | default (printf "crossplane-%s" .Chart.Name) }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ .Values.serviceAccount.name | default (printf "crossplane-%s" .Chart.Name) }}'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
rules:
# All managed resources owned by this provider.
- apiGroups: ["akeyless.crossplane.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Secrets — for reading ProviderConfig credentials, writing connection details.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Events — controller emits Kubernetes Events on reconcile.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
# ConfigMaps — leader-election + general controller-runtime use.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Leases — leader-election (when enabled).
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# CRDs — controller-runtime needs to discover them at startup.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: '{{ .Values.serviceAccount.name | default (printf "crossplane-%s" .Chart.Name) }}'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ .Values.serviceAccount.name | default (printf "crossplane-%s" .Chart.Name) }}'
subjects:
- kind: ServiceAccount
  name: '{{ .Values.serviceAccount.name | default (printf "crossplane-%s" .Chart.Name) }}'
  namespace: '{{ .Release.Namespace }}'
